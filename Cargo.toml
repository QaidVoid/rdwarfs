[package]
name = "rdwarfs"
version = "0.1.0"
edition = "2024"
description = "Independent Rust library and tools to read DwarFS images"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["archive", "compression", "deduplication", "dwarfs", "filesystem"]
categories = ["compression", "filesystem"]
rust-version = "1.85"

[lib]
name = "rdwarfs"
path = "src/lib.rs"

[dependencies]
brotli = { version = "8.0.2", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
fuser = { version = "0.17.0", default-features = false, optional = true }
libc = "0.2.186"
lz4_flex = { version = "0.13.1", optional = true }
lzma-rs = { version = "0.3.0", optional = true }
memmap2 = { version = "0.9.10", optional = true }
rayon = { version = "1.12.0", optional = true }
sha2 = "0.11.0"
tar = { version = "0.4.46", optional = true }
thiserror = "2.0.18"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = { version = "0.13.3", optional = true, default-features = false }
